<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chat App</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            height: 100vh;
            background-color: #f0f0f0;
        }

        #chat-container {
            width: 100%;
            height: 100vh; /* ให้ความสูงเต็มหน้าจอ 100% */
            box-sizing: border-box; /* ป้องกันไม่ให้ padding ดันจนล้นขอบ */
            background: white;
            padding: 20px;
            display: flex; /* ใช้ Flexbox เพื่อจัดการเลย์เอาต์ภายใน */
            flex-direction: column;
        }

        #messages {
            flex-grow: 1; /* ยืดขยายเติมเต็มพื้นที่ว่างอัตโนมัติ */
            overflow-y: auto;
            border-bottom: 1px solid #ddd;
            margin-bottom: 20px;
            padding: 10px;
        }

        .message { 
    /* 5 บรรทัดแรกนี้เป็นของเดิมที่คุณมีอยู่แล้วในไฟล์ */
    padding: 5px;            /* เว้นพื้นที่ว่างด้านในกล่องข้อความ */
    margin: 5px 0;           /* เว้นระยะห่างด้านนอกระหว่างกล่องข้อความบน-ล่าง */
    border-radius: 4px;      /* ทำมุมกล่องข้อความให้โค้งมน */
    background: #2c7aef;     /* กำหนดสีพื้นหลังของกล่องเป็นสีน้ำเงิน */
    color: white;            /* กำหนดสีตัวอักษรให้เป็นสีขาว */

    /* 2 บรรทัดด้านล่างนี้ คือ "สิ่งที่คุณต้องพิมพ์เพิ่มเข้าไป" เพื่อแก้ปัญหาครับ */
    white-space: pre-wrap; 
    word-break: break-word; 
}

        .user-message {
            text-align: right;
            background: #f9f9f9;
            color: black;
        }

        .user-message .message {
            background: #e0f7fa;
        }

        #chat-input {
            display: flex;
        }

        #chat-input input {
            flex-grow: 1;
            padding: 10px;
            margin-right: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }

        #chat-input button {
            padding: 10px 20px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        #chat-input button:hover {
            background: #0056b3;
        }
    </style>
    <script src="https://js.puter.com/v2/"></script>

</head>

<body>
    <div id="chat-container">
        <div id="messages"></div>
        <div id="chat-input">
            <input type="text" id="input-message" placeholder="Type a message...">
            <button onclick="sendMessage()">Send</button>
        </div>
    </div>
    <p>Created using Puter.JS</p>

    <script>
        const messages = [];
        function addMessage(msg, isUser) {
            const messagesDiv = document.getElementById("messages");
            const messageDiv = document.createElement("div");
            messageDiv.classList.add("message");
            if (isUser) {
                messageDiv.classList.add("user-message");
            }
            messageDiv.textContent = msg;
            messagesDiv.appendChild(messageDiv);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        function sendMessage() {
            const input = document.getElementById("input-message");
            const message = input.value.trim();
            if (message) {
                addMessage(message, true);
                input.value = '';
                // Record the message in array of messages
                messages.push({ content: message, role: 'user' });
                // Call the AI chat function

    const replyText = typeof response === 'string' ? response : response.message.content;
    
    addMessage(replyText, false);
    
    // บันทึกประวัติกลับเข้าไปใน Array ให้ถูกต้อง
    if (response.message) {
        messages.push(response.message); 
    } else {
        messages.push({ role: 'assistant', content: replyText });
    }
}).catch(error => {

    </script>
</body>

</html>
